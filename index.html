<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexora</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #e3f2fd 0%, #ffffff 100%);
      color: #1565c0;
    }
    .card {
      text-align: center;
      background: #fff;
      padding: 48px 40px;
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(21, 101, 192, 0.15);
      max-width: 420px;
    }
    h1 { font-size: 2.2rem; margin-bottom: 8px; }
    p { color: #607d8b; margin-bottom: 28px; }
    a.btn {
      display: block;
      background: #1565c0;
      color: #fff;
      text-decoration: none;
      padding: 14px;
      border-radius: 12px;
      font-weight: 600;
      margin-bottom: 12px;
      transition: background 0.2s;
    }
    a.btn:hover { background: #0d47a1; }
    a.ghost { background: #eceff1; color: #1565c0; }
    a.ghost:hover { background: #cfd8dc; }
    small { color: #90a4ae; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Nexora</h1>
    <p>Business management with an RFM AI model on the roadmap.</p>
    <a class="btn" href="nexora/">Open the App</a>
    <a class="ghost" href="https://github.com/Amir-24368/nexora">View source on GitHub</a>
    <small>Hosted free on GitHub Pages &middot; point it at your own API from the login screen (&#9881;)</small>
  </div>
</body>
</html>
